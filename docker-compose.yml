services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnsphere
      POSTGRES_PASSWORD: learnsphere
      POSTGRES_DB: learnsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnsphere -d learnsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://learnsphere:learnsphere@postgres:5432/learnsphere?schema=public
      JWT_SECRET: learnsphere-development-secret
      PORT: 5000
      CLIENT_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  postgres_data:
